<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Offline plans · PlanRecover</title><style>
:root{font-family:Arial,sans-serif;color:#18314e;background:#edf3fb;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#173b82;color:white;padding:28px max(20px,calc((100vw - 1040px)/2));display:flex;gap:24px;align-items:center;justify-content:space-between}header h1{font-size:26px;margin:0 0 8px}header p{margin:0;line-height:1.5;color:#dae6ff}header a{color:white;white-space:nowrap}main{max-width:1080px;margin:auto;padding:24px 20px}button,select,a{font:inherit}button,select{padding:10px 14px;border:1px solid #bdcbe0;border-radius:9px;background:white;color:#18314e;cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #315be8;outline-offset:3px}a{color:#214fbc;overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}select{min-width:230px;max-width:100%;flex:1}.notice{border:1px solid #c8d8ef;background:#f6f9ff;padding:14px 18px;border-radius:12px;line-height:1.5;font-size:14px}.plan{margin-top:24px}.plan h2{font-size:28px;margin:0 0 8px}.meta{color:#526681;line-height:1.6}.day{margin-top:28px}.day h3{font-size:20px;border-bottom:2px solid #315be8;padding-bottom:10px}.stop{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:20px;margin:12px 0;border:1px solid #d5dfed;background:white;border-radius:14px;break-inside:avoid}.number{width:36px;height:36px;display:grid;place-items:center;background:#315be8;color:white;font-weight:bold;border-radius:50%}.stop h4{font-size:18px;margin:0 0 8px}.stop p{margin:6px 0;line-height:1.55}.links{display:flex;gap:16px;flex-wrap:wrap}.empty{padding:40px 20px;text-align:center;background:white;border:1px solid #d5dfed;border-radius:14px}small{font-size:14px}.tasks article{padding:12px 0;border-bottom:1px solid #d5dfed}.tasks strong,.tasks span{display:block;margin:6px 0}@media(max-width:600px){header{align-items:flex-start;flex-direction:column;padding:24px 20px}main{padding:20px 14px}.stop{padding:16px;gap:10px}.toolbar select{width:100%}}@media print{@page{margin:14mm}header a,.toolbar,.notice{display:none}header{background:white;color:#18314e;padding:0}header p{color:#526681}body{background:white}main{padding:0}.number{color:#18314e;border:1px solid #315be8;background:white}.stop{border-radius:0}.links a{color:#18314e}.plan{margin-top:18px}}
</style></head><body><header><div><h1>PlanRecover · Offline plans</h1><p>Your saved itinerary copies. Read only, with times in the plan’s time zone.</p></div><a href="/">Back to website</a></header><main><div class="toolbar"><select id="plans" aria-label="Choose an offline plan"></select><button id="print">Print / Save PDF</button><button id="remove">Remove device copy</button></div><div class="notice">These copies stay on this device and don’t sync. Save a fresh copy after editing your plan. Map backgrounds, directions and venue websites need an internet connection.</div><div id="content" aria-live="polite"></div></main><!--PLAN_SNAPSHOT--><script>
const select=document.getElementById('plans'),content=document.getElementById('content'),remove=document.getElementById('remove');let copies=[],db,embedded;
function node(tag,text,parent,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;parent?.appendChild(el);return el;}
function link(parent,text,url){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)return;const a=node('a',text,parent);a.href=u.href;a.target='_blank';a.rel='noreferrer';}catch{}}
function render(){content.replaceChildren();const plan=copies.find(p=>p.id===select.value)||copies[0];remove.hidden=!!embedded;document.getElementById('print').disabled=!plan;remove.disabled=!plan;select.disabled=copies.length<2;if(!plan){const box=node('div',undefined,content,'empty');node('h2','No offline copies yet',box);node('p','Open a plan while connected, then choose Save offline or Download copy.',box);return;}
 const area=node('div',undefined,content,'plan');node('h2',plan.name,area);node('p',`${plan.destination} · ${plan.start} – ${plan.end}`,area,'meta');node('p',`Times in ${plan.timezone} · Saved ${new Date(plan.savedAt).toLocaleString()}`,area,'meta');
 for(const day of [...new Set(plan.stops.map(s=>s.day))]){const section=node('section',undefined,area,'day');node('h3',new Date(day+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}),section);for(const stop of plan.stops.filter(s=>s.day===day)){const article=node('article',undefined,section,'stop');node('span',String(stop.number),article,'number');const details=node('div',undefined,article);node('h4',stop.name,details);node('p',`${stop.time} · ${stop.duration} min · ${stop.status}`,details);node('p',stop.location,details,'meta');node('p',stop.cost,details);if(stop.hours)node('p',`Listed hours: ${stop.hours}. Confirm before visiting.`,details);const links=node('div',undefined,details,'links');if(stop.website)link(links,'Official website',stop.website);if(Number.isFinite(stop.latitude)&&Number.isFinite(stop.longitude)&&Math.abs(stop.latitude)<=90&&Math.abs(stop.longitude)<=180)link(links,'Directions',`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(stop.latitude+','+stop.longitude)}`);}}
 if(!plan.stops.length)node('p','No activities scheduled in this copy.',area);if(plan.tasks?.length){const tasks=node('section',undefined,area,'tasks');node('h3','Preparation',tasks);for(const task of plan.tasks){const row=node('article',undefined,tasks);node('strong',`${task.done?'✓':'□'} ${task.name}`,row);node('span',`Due ${task.due}`,row);}}
}
function list(){select.replaceChildren();for(const plan of copies){const option=node('option',plan.name,select);option.value=plan.id;}render();}
select.addEventListener('change',render);document.getElementById('print').addEventListener('click',()=>window.print());remove.addEventListener('click',()=>{if(!db)return;const id=select.value,tx=db.transaction('plans','readwrite');tx.objectStore('plans').delete(id);tx.oncomplete=()=>{copies=copies.filter(p=>p.id!==id);list();};tx.onerror=()=>node('p','Could not remove this copy. Try again.',content);});
try{const payload=document.getElementById('plan-snapshot');if(payload){embedded=JSON.parse(payload.textContent);copies=[embedded];list();}else{const request=indexedDB.open('planrecover-offline',1);request.onupgradeneeded=()=>request.result.createObjectStore('plans',{keyPath:'id'});request.onsuccess=()=>{db=request.result;const all=db.transaction('plans','readonly').objectStore('plans').getAll();all.onsuccess=()=>{copies=all.result.sort((a,b)=>b.savedAt.localeCompare(a.savedAt));list();};all.onerror=()=>list();};request.onerror=()=>{list();node('p','Device storage is unavailable. A downloaded copy can still be opened directly.',content);};}}catch{list();node('p','This copy could not be read. Reconnect and save it again.',content);}
</script></body></html>
